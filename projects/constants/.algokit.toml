[algokit]
min_version = "v2.0.0"

[project]
type = "library"
name = "constants"

[project.run]
build = { commands = ['npm run build'], description = 'Build the constants package' }
lint = { commands = ['npm run lint'], description = 'Lint shared constants with ESLint' }
format = { commands = ['npm run format'], description = 'Check formatting with Prettier' }
check-types = { commands = ['npm run check-types'], description = 'Type-check shared constants with tsc' }
