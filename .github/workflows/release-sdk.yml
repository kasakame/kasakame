name: release-sdk

# Manual release of @kasakame/sdk from the released @kasakame/contracts package (release contracts and constants first); version must match package.json (see docs/ci.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SDK version, without the v prefix (e.g. 0.1.0); must match projects/sdk/package.json'
        required: true
        type: string
      dry_run:
        description: 'Run all checks but skip publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  prep:
    name: Prepare and verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      contracts: ${{ steps.version.outputs.contracts }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json

      - name: Install SDK dependencies
        run: npm ci
        working-directory: projects/sdk

      - name: Validate version and choose dist-tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        # The script writes version and tag to GITHUB_OUTPUT.
        run: |
          node projects/utils/release/validate-version.ts projects/sdk/package.json "$INPUT_VERSION"
          contracts=$(node -p "require('./projects/contracts/package.json').version")
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"
          echo "SDK contracts version: $contracts"

      - name: Check the version is unpublished
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node projects/utils/release/assert-unpublished.ts "@kasakame/sdk" "$VERSION"

      # The released contracts package is the only interface input; never set SDK_SPECS=local here, since a published SDK must not use an unreleased checkout.
      - name: Install the released contracts package
        env:
          CONTRACTS_VERSION: ${{ steps.version.outputs.contracts }}
        run: npm install --no-save --no-package-lock "@kasakame/contracts@$CONTRACTS_VERSION"
        working-directory: projects/sdk

      - name: Regenerate clients from the released contracts package
        run: npm run codegen
        working-directory: projects/sdk

      # Codegen already ran in the previous step, so --ignore-scripts skips the prebuild hook and this step is only the TypeScript emit.
      - name: Compile TypeScript
        run: npm run build --ignore-scripts
        working-directory: projects/sdk

      - name: Lint
        run: npm run lint
        working-directory: projects/sdk

      - name: Check formatting
        run: npm run format
        working-directory: projects/sdk

      - name: Type-check
        run: npm run check-types
        working-directory: projects/sdk

      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/sdk

      - name: Pack the npm package
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)
          test -f "$RUNNER_TEMP/$tarball"
          echo "packed $tarball"
        working-directory: projects/sdk

      - name: Verify the npm tarball
        run: |
          tarball=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          node projects/utils/release/verify-tarball.ts "$tarball" projects/sdk \
            dist/ \
            --forbid src/ --forbid test/ --forbid scripts/

      - name: Dry-run the publish
        run: |
          tarball=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          node projects/utils/release/publish.ts projects/sdk --tag "${{ steps.version.outputs.tag }}" --tarball "$tarball" --ignore-scripts --dry-run

      - name: Upload the tested tarball
        uses: actions/upload-artifact@v7
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Upload the tested dist
        uses: actions/upload-artifact@v7
        with:
          name: sdk-dist
          path: projects/sdk/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload the generated clients
        uses: actions/upload-artifact@v7
        with:
          name: sdk-generated
          path: projects/sdk/src/generated
          if-no-files-found: error
          retention-days: 7

  integration:
    name: SDK LocalNet integration
    runs-on: ubuntu-latest
    needs: prep
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json

      - name: Install SDK dependencies
        run: npm ci
        working-directory: projects/sdk

      - name: Download generated clients
        uses: actions/download-artifact@v8
        with:
          name: sdk-generated
          path: projects/sdk/src/generated

      - name: Download the tested dist
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: projects/sdk/dist

      - name: Verify the tested dist loads
        run: node -e "import('./dist/index.js').then((sdk) => { if (typeof sdk.configureSdk !== 'function') process.exit(1) })"
        working-directory: projects/sdk

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache AlgoKit CLI
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: algokit-2.10.2-py3.12-${{ runner.os }}

      - name: Install AlgoKit CLI
        run: bash .github/scripts/install-algokit.sh
        shell: bash

      - name: Start LocalNet (algod + indexer)
        run: algokit localnet start

      - name: Run SDK LocalNet integration tests
        run: npm run test:integration
        working-directory: projects/sdk

  smoke:
    name: Smoke-test the packed package
    runs-on: ubuntu-latest
    needs: prep
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the tested tarball
        uses: actions/download-artifact@v8
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}

      - name: Smoke-test the packed package
        env:
          EXPECTED_SPECS_VERSION: ${{ needs.prep.outputs.contracts }}
        run: |
          tarball=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          node projects/utils/release/pack-smoke.ts projects/sdk projects/utils/smoke/sdk.ts --tarball "$tarball"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [prep, smoke, integration]
    permissions:
      contents: read
      # OIDC authenticates the publish and signs provenance.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download the tested tarball
        uses: actions/download-artifact@v8
        with:
          name: sdk-tarball
          path: ${{ runner.temp }}

      - name: Verify the checked-out version
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          version=$(node -p "require('./projects/sdk/package.json').version")
          if [[ "$version" != "$VERSION" ]]; then
            echo "checked-out version $version does not match prep $VERSION" >&2
            exit 1
          fi

      - name: Publish with provenance (OIDC)
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          tarball=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          echo "publishing @kasakame/sdk@${{ needs.prep.outputs.version }} from $tarball with dist-tag $TAG using OIDC"
          node projects/utils/release/publish.ts projects/sdk --tag "$TAG" --tarball "$tarball" --ignore-scripts

      - name: Skip publish (dry run)
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true; package verified but not published"

      - name: Verify the published version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        # npm stages a new package ("being processed") before it is visible; the first publish took ~2.5 minutes, and normal publishes exit immediately.
        run: node projects/utils/release/verify-published.ts "@kasakame/sdk" "$VERSION"
