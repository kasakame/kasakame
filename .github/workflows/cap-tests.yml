name: cap-tests

on:
  schedule:
    # Weekly, Monday 04:00 UTC. Each suite fills a 524,287-position tree (~5 h).
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to test (empty = the dispatched ref)
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cap:
    name: Cap-scale ${{ matrix.suite }} campaign
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: failed
            script: test:cap:failed
          - suite: claimed
            script: test:cap:claimed
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache AlgoKit CLI
        uses: actions/cache@v6
        with:
          path: ~/.local
          key: algokit-2.10.2-py3.12-${{ runner.os }}

      - name: Install AlgoKit CLI
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install contract dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Compile contracts (TEAL + generated clients)
        run: npm run build
        working-directory: projects/contracts

      - name: Start LocalNet (algod only)
        run: |
          algokit localnet start
          # The cap suites read algod only; stopping the indexer pipeline keeps its
          # database from consuming the runner disk during the multi-hour run.
          docker stop algokit_sandbox_indexer algokit_sandbox_conduit algokit_sandbox_postgres

      - name: Run cap-scale suite
        run: npm run ${{ matrix.script }}
        working-directory: projects/contracts
