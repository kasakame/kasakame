name: check-issue

on:
  issues:
    types: [opened, edited, reopened, typed, untyped, field_added, field_removed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to check
        required: true
        type: number

concurrency:
  group: check-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check-issue:
    name: Check issue metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check metadata
        run: node projects/utils/scripts/check-issue.ts
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
