name: release-cli

# Manual release of @kasakame/cli against the published SDK (release constants and SDK first); version must match package.json, and publishing uses npm OIDC trusted publishing (see docs/ci.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'CLI version, without the v prefix (e.g. 0.1.0); must match projects/cli/package.json'
        required: true
        type: string
      dry_run:
        description: 'Run all checks but skip publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  prep:
    name: Prepare and verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/cli/package-lock.json

      # The committed dependency is the published SDK; a published CLI must ship against a released SDK, not `file:../sdk`.

      - name: Install CLI dependencies
        run: npm ci
        working-directory: projects/cli

      - name: Validate version and choose dist-tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        # The script writes version and tag to GITHUB_OUTPUT.
        run: node projects/utils/release/validate-version.ts projects/cli/package.json "$INPUT_VERSION"

      - name: Check the version is unpublished
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node projects/utils/release/assert-unpublished.ts "@kasakame/cli" "$VERSION"

      - name: Lint
        run: npm run lint
        working-directory: projects/cli

      - name: Check formatting
        run: npm run format
        working-directory: projects/cli

      - name: Type-check
        run: npm run check-types
        working-directory: projects/cli

      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/cli

      - name: Build
        run: npm run build
        working-directory: projects/cli

      - name: Inspect package contents
        run: npm pack --dry-run
        working-directory: projects/cli

      - name: Pack the npm package
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)
          test -f "$RUNNER_TEMP/$tarball"
          echo "packed $tarball"
        working-directory: projects/cli

      - name: Verify the npm tarball
        run: |
          tarball=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          node projects/utils/release/verify-tarball.ts "$tarball" projects/cli \
            dist/ \
            --forbid src/ --forbid test/ --forbid scripts/

      - name: Dry-run the publish
        run: |
          tarball=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          node projects/utils/release/publish.ts projects/cli --tag "${{ steps.version.outputs.tag }}" --tarball "$tarball" --ignore-scripts --dry-run

      - name: Upload the tested tarball
        uses: actions/upload-artifact@v7
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke-test the packed package
    runs-on: ubuntu-latest
    needs: prep
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the tested tarball
        uses: actions/download-artifact@v8
        with:
          name: cli-tarball
          path: ${{ runner.temp }}

      - name: Smoke-test the packed package
        run: |
          tarball=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          node projects/utils/release/pack-smoke.ts projects/cli projects/utils/smoke/cli.ts --tarball "$tarball"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [prep, smoke]
    permissions:
      contents: read
      # OIDC authenticates the publish and signs provenance.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download the tested tarball
        uses: actions/download-artifact@v8
        with:
          name: cli-tarball
          path: ${{ runner.temp }}

      - name: Verify the checked-out version
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          version=$(node -p "require('./projects/cli/package.json').version")
          if [[ "$version" != "$VERSION" ]]; then
            echo "checked-out version $version does not match prep $VERSION" >&2
            exit 1
          fi

      - name: Publish with provenance (OIDC)
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          tarball=$(find "$RUNNER_TEMP" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          echo "publishing @kasakame/cli@${{ needs.prep.outputs.version }} from $tarball with dist-tag $TAG using OIDC"
          node projects/utils/release/publish.ts projects/cli --tag "$TAG" --tarball "$tarball" --ignore-scripts

      - name: Skip publish (dry run)
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true; package verified but not published"

      - name: Verify the published version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        # npm stages a new package ("being processed") before it is visible.
        run: node projects/utils/release/verify-published.ts "@kasakame/cli" "$VERSION"
