name: release-constants

# Manual release of @kasakame/constants. Release it before @kasakame/sdk and
# @kasakame/cli: both declare it as a peer dependency, and their smoke tests
# install it from the registry. The dispatch version must match
# projects/constants/package.json, and dry_run defaults to true; set it to
# false only for a real release.
#
# Normal releases use npm OIDC trusted publishing (no NPM_TOKEN). The first
# release is a bootstrap: npm requires the package to exist before a trusted
# publisher can be configured, so dispatch with dry_run=false, bootstrap=true,
# and a temporary NPM_TOKEN secret. Both paths pass --provenance; the token is
# only for authentication. Delete the secret and revoke the token after that
# release.
#
# Configure the trusted publisher for @kasakame/constants as GitHub owner
# `kasakame`, repository `kasakame`, workflow `release-constants.yml`, with no
# environment and "Allow npm publish" enabled.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Constants version, without the v prefix (e.g. 0.2.0); must match projects/constants/package.json'
        required: true
        type: string
      dry_run:
        description: 'Run all checks but skip publishing'
        required: true
        default: true
        type: boolean
      bootstrap:
        description: 'Publish with NPM_TOKEN (first release only, before trusted publishing)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-constants
  cancel-in-progress: false

jobs:
  prep:
    name: Prepare and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/constants/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: projects/constants

      - name: Validate version and choose dist-tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          node .github/scripts/check-release-version.mjs projects/constants/package.json "$INPUT_VERSION"
          version=$(node -p "require('./projects/constants/package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "package version is not semver: $version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            tag=next
          else
            tag=latest
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "@kasakame/constants@$version -> $tag"

      - name: Check the version is unpublished
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@kasakame/constants@$VERSION" version >/dev/null 2>&1; then
            echo "@kasakame/constants@$VERSION is already published" >&2
            exit 1
          fi
          echo "@kasakame/constants@$VERSION is free"

      - name: Build
        run: npm run build
        working-directory: projects/constants

      - name: Check committed dist is current
        run: test -z "$(git status --porcelain -- projects/constants/dist)"

      - name: Check formatting
        run: npm run format
        working-directory: projects/constants

      - name: Lint
        run: npm run lint
        working-directory: projects/constants

      - name: Type-check
        run: npm run check-types
        working-directory: projects/constants

      - name: Inspect package contents
        run: npm pack --dry-run
        working-directory: projects/constants

      - name: Dry-run the publish
        run: npm publish --dry-run
        working-directory: projects/constants

      # A clean consumer must import the compiled values from the tarball.
      - name: Smoke-test the packed package
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/$tarball"
          node --input-type=module -e "import('@kasakame/constants').then((c) => { if (c.ZERO_ROOT_HEX !== '0'.repeat(64)) throw new Error('bad zero root'); if (c.MAX_TREE_SIZE !== 524287n) throw new Error('bad tree cap'); console.log('constants smoke passed') })"
          node --input-type=module -e "import('node:module').then(({ createRequire }) => { const require = createRequire(import.meta.url); const source = require.resolve('@kasakame/constants/source'); if (!source.endsWith('src/index.ts')) throw new Error('bad source entry: ' + source); console.log('constants source entry resolved') })"
        working-directory: projects/constants

      - name: Upload the tested dist
        uses: actions/upload-artifact@v7
        with:
          name: constants-dist
          path: projects/constants/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: prep
    permissions:
      contents: read
      # OIDC authenticates normal releases and signs provenance on both paths.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download the tested dist
        uses: actions/download-artifact@v8
        with:
          name: constants-dist
          path: projects/constants/dist

      - name: Verify package files
        run: |
          test -f README.md
          test -f LICENSE
          test -f dist/index.js
          test -f dist/index.d.ts
        working-directory: projects/constants

      - name: Verify the checked-out version
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          version=$(node -p "require('./projects/constants/package.json').version")
          if [[ "$version" != "$VERSION" ]]; then
            echo "checked-out version $version does not match prep $VERSION" >&2
            exit 1
          fi

      - name: Require the bootstrap token
        if: ${{ inputs.bootstrap && !inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "bootstrap=true but the NPM_TOKEN secret is not set" >&2
            exit 1
          fi

      - name: Publish with the bootstrap token
        if: ${{ inputs.bootstrap && !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          echo "publishing @kasakame/constants@${{ needs.prep.outputs.version }} with dist-tag $TAG using the bootstrap token"
          npm publish --provenance --access public --tag "$TAG"
        working-directory: projects/constants

      - name: Publish with provenance (OIDC)
        if: ${{ !inputs.bootstrap && !inputs.dry_run }}
        env:
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          echo "publishing @kasakame/constants@${{ needs.prep.outputs.version }} with dist-tag $TAG using OIDC"
          npm publish --provenance --access public --tag "$TAG"
        working-directory: projects/constants

      - name: Skip publish (dry run)
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true; package verified but not published"

      - name: Verify the published version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        # npm stages a new package ("being processed") before it is visible.
        run: |
          for attempt in {1..40}; do
            if npm view "@kasakame/constants@$VERSION" version >/dev/null 2>&1; then
              echo "@kasakame/constants@$VERSION is visible (attempt $attempt/40)"
              exit 0
            fi
            echo "not visible yet (attempt $attempt/40); waiting"
            sleep 15
          done
          npm view "@kasakame/constants@$VERSION" version || true
          echo "@kasakame/constants@$VERSION did not appear in the registry after 10 minutes" >&2
          exit 1
