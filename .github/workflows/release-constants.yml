name: release-constants

# Manual release of @kasakame/constants. Release it before @kasakame/sdk and
# @kasakame/cli: both declare it as a peer dependency, and their smoke tests
# install it from the registry. The dispatch version must match
# projects/constants/package.json, and dry_run defaults to true; set it to
# false only for a real release.
#
# Releases use npm OIDC trusted publishing.
#
# Configure the trusted publisher for @kasakame/constants as GitHub owner
# `kasakame`, repository `kasakame`, workflow `release-constants.yml`, with no
# environment and "Allow npm publish" enabled.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Constants version, without the v prefix (e.g. 0.2.0); must match projects/constants/package.json'
        required: true
        type: string
      dry_run:
        description: 'Run all checks but skip publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-constants
  cancel-in-progress: false

jobs:
  prep:
    name: Prepare and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/constants/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: projects/constants

      - name: Validate version and choose dist-tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        # The script writes version and tag to GITHUB_OUTPUT.
        run: node projects/utils/release/validate-version.ts projects/constants/package.json "$INPUT_VERSION"

      - name: Check the version is unpublished
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node projects/utils/release/assert-unpublished.ts "@kasakame/constants" "$VERSION"

      - name: Build
        run: npm run build
        working-directory: projects/constants

      - name: Check committed dist is current
        run: test -z "$(git status --porcelain -- projects/constants/dist)"

      - name: Check formatting
        run: npm run format
        working-directory: projects/constants

      - name: Lint
        run: npm run lint
        working-directory: projects/constants

      - name: Type-check
        run: npm run check-types
        working-directory: projects/constants

      - name: Inspect package contents
        run: npm pack --dry-run
        working-directory: projects/constants

      - name: Dry-run the publish
        run: node projects/utils/release/publish.ts projects/constants --tag "${{ steps.version.outputs.tag }}" --dry-run

      # A clean consumer must import the compiled values from the tarball.
      - name: Smoke-test the packed package
        run: node projects/utils/release/pack-smoke.ts projects/constants projects/utils/smoke/constants.ts

      - name: Upload the tested dist
        uses: actions/upload-artifact@v7
        with:
          name: constants-dist
          path: projects/constants/dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: prep
    permissions:
      contents: read
      # OIDC authenticates normal releases and signs provenance on both paths.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download the tested dist
        uses: actions/download-artifact@v8
        with:
          name: constants-dist
          path: projects/constants/dist

      - name: Verify package files
        run: |
          test -f README.md
          test -f LICENSE
          test -f dist/index.js
          test -f dist/index.d.ts
        working-directory: projects/constants

      - name: Verify the checked-out version
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: |
          version=$(node -p "require('./projects/constants/package.json').version")
          if [[ "$version" != "$VERSION" ]]; then
            echo "checked-out version $version does not match prep $VERSION" >&2
            exit 1
          fi

      - name: Publish with provenance (OIDC)
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.prep.outputs.tag }}
        run: |
          echo "publishing @kasakame/constants@${{ needs.prep.outputs.version }} with dist-tag $TAG using OIDC"
          node projects/utils/release/publish.ts projects/constants --tag "$TAG"

      - name: Skip publish (dry run)
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true; package verified but not published"

      - name: Verify the published version
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.prep.outputs.version }}
        run: node projects/utils/release/verify-published.ts "@kasakame/constants" "$VERSION"
