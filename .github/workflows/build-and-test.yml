name: build-and-test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      sdk: ${{ steps.filter.outputs.sdk }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
      local_sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          # PRs use the changed-files API; pushes diff against the previous
          # commit on main. Shared paths enable every lane (fail open).
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          predicate-quantifier: some-with-excludes
          filters: |
            contracts:
              - 'projects/contracts/**'
              - '!**/*.md'
              - '!**/LICENSE'
            sdk:
              - 'projects/sdk/**'
              - 'projects/contracts/**'
              - '!**/*.md'
              - '!**/LICENSE'
            frontend:
              - 'projects/frontend/**'
              - 'projects/sdk/**'
              - 'projects/contracts/**'
              - '!**/*.md'
              - '!**/LICENSE'
            backend:
              - 'projects/backend/**'
              - '!**/*.md'
              - '!**/LICENSE'
            shared:
              - '**'
              - '!projects/contracts/**'
              - '!projects/sdk/**'
              - '!projects/frontend/**'
              - '!projects/backend/**'
              - '!docs/**/*.{png,jpg,jpeg,gif,svg,webp,pdf}'
              - '!**/LICENSE'
              - '!**/*.md'
              - '!.markdownlint-cli2.jsonc'
              - '!.gitignore'
              - '!.editorconfig'
              - '!kasakame.code-workspace'

  # Compile the contracts once when they (or a shared path) changed. The
  # artifact feeds the SDK lanes, the frontend lanes, `build`, and
  # `integration-test` instead of each recompiling.
  build-contracts:
    name: Build contracts (TEAL + ARC-56 artifacts)
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AlgoKit CLI
        run: |
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Compile contracts (TEAL + generate clients)
        run: npm run build
        working-directory: projects/contracts

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
          if-no-files-found: error

  # Contracts lint/format/type-check - pure Node, no artifacts, no build.
  lint-contracts:
    name: Lint, format, type-check (contracts)
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/contracts
      - name: Lint
        run: npm run lint
        working-directory: projects/contracts
      - name: Check formatting
        run: npm run format
        working-directory: projects/contracts
      - name: Type-check
        run: npm run check-types
        working-directory: projects/contracts

  # Contracts unit tests - pure Node; the offline suite runs the contract
  # source directly, so it never needs the compiled artifacts.
  test-contracts:
    name: Unit tests (contracts)
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/contracts
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/contracts

  # SDK checks - run when the SDK, contracts, or a shared path changed. Codegen
  # regenerates the clients from the same-run artifacts when the contracts
  # changed (SDK_SPECS=local), from the pinned specs release otherwise.
  lint-sdk:
    name: Lint, format, type-check (sdk)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.sdk == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Install dependencies
        run: npm ci
        working-directory: projects/sdk
      - name: Regenerate clients
        run: npm run codegen
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Lint
        run: npm run lint
        working-directory: projects/sdk
      - name: Check formatting
        run: npm run format
        working-directory: projects/sdk
      - name: Type-check
        run: npm run check-types
        working-directory: projects/sdk

  test-sdk:
    name: Unit tests (sdk)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.sdk == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Install dependencies
        run: npm ci
        working-directory: projects/sdk
      - name: Regenerate clients
        run: npm run codegen
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/sdk

  # Frontend checks - run when the frontend, SDK, contracts, or a shared path
  # changed. A frontend-only change installs the published @kasakame/sdk, so
  # routine work exercises what users install; a contracts or SDK change builds
  # the local `file:../sdk` (same-run artifacts when the contracts changed).
  lint-frontend:
    name: Lint, format, type-check (frontend)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            projects/frontend/package-lock.json
            projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Build the local SDK
        if: needs.changes.outputs.local_sdk == 'true'
        run: |
          npm ci
          npm run build
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Install frontend dependencies (published SDK)
        if: needs.changes.outputs.local_sdk != 'true'
        run: npm ci
        working-directory: projects/frontend
      - name: Install frontend dependencies (local SDK)
        if: needs.changes.outputs.local_sdk == 'true'
        run: npm install --no-save --install-links "file:../sdk"
        working-directory: projects/frontend
      - name: Lint
        run: npm run lint
        working-directory: projects/frontend
      - name: Check formatting
        run: npm run format
        working-directory: projects/frontend
      - name: Type-check
        run: npm run check-types
        working-directory: projects/frontend

  test-frontend:
    name: Unit tests (frontend)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            projects/frontend/package-lock.json
            projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Build the local SDK
        if: needs.changes.outputs.local_sdk == 'true'
        run: |
          npm ci
          npm run build
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Install frontend dependencies (published SDK)
        if: needs.changes.outputs.local_sdk != 'true'
        run: npm ci
        working-directory: projects/frontend
      - name: Install frontend dependencies (local SDK)
        if: needs.changes.outputs.local_sdk == 'true'
        run: npm install --no-save --install-links "file:../sdk"
        working-directory: projects/frontend
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/frontend

  # The same-SHA end-to-end gate for the web stack: runs when the frontend,
  # SDK, contracts, or a shared path changed, and bundles the frontend against
  # the local SDK - built from the same-run artifacts when the contracts
  # changed, from the pinned specs release otherwise.
  build:
    name: Build (SDK + frontend bundle)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            projects/frontend/package-lock.json
            projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Install SDK dependencies
        run: npm ci
        working-directory: projects/sdk
      - name: Build SDK package (codegen + tsc)
        run: npm run build
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Install frontend dependencies (local SDK)
        run: npm install --no-save --install-links "file:../sdk"
        working-directory: projects/frontend
      - name: Build frontend bundle (Vite)
        run: npx vite build
        working-directory: projects/frontend

  # Deploy + exercise the compiled TEAL on a live LocalNet. Reuses the
  # same-run contract artifacts; meaningful when the contracts or a shared path
  # changed.
  integration-test:
    name: Integration tests (localnet)
    needs: [changes, build-contracts]
    if: always() && (needs.changes.outputs.contracts == 'true' || needs.changes.outputs.shared == 'true') && needs.build-contracts.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json

      - name: Download contract artifacts
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AlgoKit CLI
        run: |
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install contract dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Start LocalNet (algod + indexer)
        run: algokit localnet start

      - name: Run LocalNet integration tests
        run: npm run test:integration
        working-directory: projects/contracts

  # Backend lane: lint/format/types plus the suite against a throwaway
  # Postgres. Runs when the backend or a shared path changed; needs nothing but
  # `changes`.
  backend:
    name: Backend (lint, format, types, tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasakame
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kasakame
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/backend
      - name: Run migrations
        run: npm run db:migrate
        working-directory: projects/backend
      - name: Lint
        run: npm run lint
        working-directory: projects/backend
      - name: Check formatting
        run: npm run format
        working-directory: projects/backend
      - name: Type-check
        run: npm run check-types
        working-directory: projects/backend
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/backend

  # Single required check: skipped change-detection jobs don't block merges
  # under strict branch protection - only failures and cancellations do.
  gate:
    name: Gate
    if: always()
    needs:
      - changes
      - build-contracts
      - lint-contracts
      - test-contracts
      - lint-sdk
      - test-sdk
      - lint-frontend
      - test-frontend
      - build
      - integration-test
      - backend
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs failed or were cancelled:" >&2
          echo '${{ toJSON(needs) }}' >&2
          exit 1
      - name: Pass
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All jobs passed or were skipped."
