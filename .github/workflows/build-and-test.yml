name: build-and-test

on:
  pull_request:
  push:
    branches: [main]

# This workflow is the same-commit gate: every SDK build regenerates clients
# from the build job's ARC-56 artifacts. The frontend's pre* hooks rebuild the
# SDK in later steps, so the override lives here instead of on individual steps.
env:
  SDK_SPECS: local

jobs:
  # Build once: compile contracts (TEAL + ARC-56 specs), regenerate the SDK
  # clients from those specs, and bundle the frontend. All outputs are
  # gitignored and regenerable; the contract artifacts are shared as
  # artifacts instead of being rebuilt by every consumer.
  build:
    name: Build contracts, frontend, and SDK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Cache each project's node_modules (setup-node keys its cache by a
      # single lockfile path, so one step per project).
      - name: Set up Node.js (contracts cache)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json
      - name: Set up Node.js (frontend cache)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/frontend/package-lock.json
      - name: Set up Node.js (sdk cache)
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AlgoKit CLI
        run: |
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install contract dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Compile contracts (TEAL + generate clients)
        run: npm run build
        working-directory: projects/contracts

      # The SDK's prebuild codegen regenerates clients from the ARC-56 specs
      # in src/generated/ (gitignored); SDK_SPECS=local points it at the
      # contracts build above instead of the pinned specs release. The
      # frontend then resolves `@kasakame/sdk` as a `file:` dependency with a
      # prebuilt dist/, so the SDK builds before the frontend bundle.
      - name: Install SDK dependencies
        run: npm ci
        working-directory: projects/sdk

      - name: Build SDK package (codegen + tsc)
        run: npm run build
        working-directory: projects/sdk

      - name: Install frontend dependencies
        run: npm ci
        working-directory: projects/frontend

      - name: Build frontend bundle (Vite)
        run: npx vite build
        working-directory: projects/frontend

      # Share the contract artifacts with the downstream jobs.
      - name: Upload contract artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
          if-no-files-found: error

  # Pure static checks - no build, no AlgoKit. Symmetric across projects.
  lint-format-type-check:
    name: Lint, format, and type-check (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: [contracts, frontend, sdk]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/${{ matrix.project }}/package-lock.json

      # The SDK's codegen regenerates clients from ARC-56 specs into
      # src/generated/ (gitignored); SDK_SPECS=local uses the build job's
      # artifacts for the sdk lane and the SDK build the frontend needs.
      - name: Download contract artifacts
        if: matrix.project != 'contracts'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts

      - name: Install dependencies
        run: npm ci
        working-directory: projects/${{ matrix.project }}

      # Regenerate the clients before type-checking the SDK (SDK_SPECS=local
      # reads the downloaded ARC-56 specs, no release download).
      - name: Run SDK codegen
        if: matrix.project == 'sdk'
        run: npm run codegen
        working-directory: projects/sdk

      # The frontend lane resolves `@kasakame/sdk` (file:../sdk) and needs its
      # built dist/ before type-checking; the SDK build regenerates the clients
      # from the downloaded specs via its prebuild codegen.
      - name: Install and build the SDK
        if: matrix.project == 'frontend'
        run: |
          npm ci
          npm run build
        working-directory: projects/sdk

      - name: Lint
        run: npm run lint
        working-directory: projects/${{ matrix.project }}
      - name: Check formatting
        run: npm run format
        working-directory: projects/${{ matrix.project }}
      - name: Type-check
        run: npm run check-types
        working-directory: projects/${{ matrix.project }}

  # Unit tests + coverage - pure Node, symmetric across projects.
  unit-test:
    name: Unit tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        project: [contracts, frontend, sdk]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/${{ matrix.project }}/package-lock.json

      # The SDK's codegen regenerates clients from ARC-56 specs into
      # src/generated/ (gitignored); SDK_SPECS=local uses the build job's
      # artifacts for the sdk lane and the SDK build the frontend needs.
      - name: Download contract artifacts
        if: matrix.project != 'contracts'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts

      - name: Install dependencies
        run: npm ci
        working-directory: projects/${{ matrix.project }}

      # Regenerate the clients before running the SDK suite (SDK_SPECS=local
      # reads the downloaded ARC-56 specs, no release download).
      - name: Run SDK codegen
        if: matrix.project == 'sdk'
        run: npm run codegen
        working-directory: projects/sdk

      # The frontend lane resolves `@kasakame/sdk` (file:../sdk) and needs its
      # built dist/ for the tests; the SDK build regenerates the clients from
      # the downloaded specs via its prebuild codegen.
      - name: Install and build the SDK
        if: matrix.project == 'frontend'
        run: |
          npm ci
          npm run build
        working-directory: projects/sdk

      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/${{ matrix.project }}

  # Backend lane: lint/format/types plus the suite against a throwaway
  # Postgres. Needs nothing from the build job (no generated clients), so it
  # runs standalone - same workflow so failures stay attributable to the lane.
  backend:
    name: Backend (lint, format, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasakame
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kasakame
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/backend
      - name: Run migrations
        run: npm run db:migrate
        working-directory: projects/backend
      - name: Lint
        run: npm run lint
        working-directory: projects/backend
      - name: Check formatting
        run: npm run format
        working-directory: projects/backend
      - name: Type-check
        run: npm run check-types
        working-directory: projects/backend
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/backend

  # Deploy + exercise the compiled TEAL on a live LocalNet. Reuses the
  # compiled contract artifacts from the build job instead of recompiling.
  integration-test:
    name: Integration tests (localnet)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json

      - name: Download contract artifacts
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AlgoKit CLI
        run: |
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install contract dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Start LocalNet (algod + indexer)
        run: algokit localnet start

      - name: Run LocalNet integration tests
        run: npm run test:integration
        working-directory: projects/contracts
