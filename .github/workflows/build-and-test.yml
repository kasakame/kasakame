name: build-and-test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      sdk: ${{ steps.filter.outputs.sdk }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ci: ${{ steps.filter.outputs.ci }}
      config: ${{ steps.filter.outputs.config }}
      oracle: ${{ steps.filter.outputs.oracle }}
      shell: ${{ steps.filter.outputs.shell }}
      shared: ${{ steps.filter.outputs.shared }}
      local_sdk: ${{ steps.filter.outputs.contracts == 'true' || steps.filter.outputs.sdk == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          # PRs use the changed-files API; pushes diff against the previous
          # commit on main. `ci`, `shell`, and `config` have their own lanes;
          # unknown shared paths fail open to the app lanes, never to contracts.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          predicate-quantifier: some-with-excludes
          filters: |
            contracts:
              - 'projects/contracts/**'
              - '!**/*.md'
              - '!**/LICENSE'
            sdk:
              - 'projects/sdk/**'
              - '!**/*.md'
              - '!**/LICENSE'
            frontend:
              - 'projects/frontend/**'
              - '!**/*.md'
              - '!**/LICENSE'
            backend:
              - 'projects/backend/**'
              - '!**/*.md'
              - '!**/LICENSE'
            ci:
              - '.github/**'
              - '!**/*.md'
            config:
              - '.prettierrc.json'
            oracle:
              - 'docs/claim-tree-protocol-reference.py'
            shell:
              - '**/*.sh'
              - '**/*.bash'
              - '!**/node_modules/**'
            shared:
              - '**'
              - '!projects/contracts/**'
              - '!projects/sdk/**'
              - '!projects/frontend/**'
              - '!projects/backend/**'
              - '!.github/**'
              - '!docs/claim-tree-protocol-reference.py'
              - '!.prettierrc.json'
              - '!docs/**/*.{png,jpg,jpeg,gif,svg,webp,pdf}'
              - '!**/LICENSE'
              - '!**/*.md'
              - '!**/*.sh'
              - '!**/*.bash'
              - '!.markdownlint-cli2.jsonc'
              - '!.gitignore'
              - '!.editorconfig'
              - '!kasakame.code-workspace'

  # Workflow-file lint: the only code lane a CI-only change needs.
  actionlint:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12

  # Standalone shell scripts repo-wide. Workflow `run:` blocks are covered by
  # actionlint, whose image bundles shellcheck.
  shellcheck:
    name: Lint shell scripts
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' '*.bash' | xargs -0 -r shellcheck

  # Compile the contracts once, only when the contracts changed. The artifact
  # feeds `build-sdk`, the SDK lanes, and `integration-test`.
  build-contracts:
    name: Build contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AlgoKit CLI
        run: |
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Compile contracts (TEAL + generate clients)
        run: npm run build
        working-directory: projects/contracts

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Build the SDK package once for the frontend lanes when the SDK or contracts
  # changed. Frontend-only and shared-only changes use the published package.
  build-sdk:
    name: Build SDK (local package)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled() && needs.changes.outputs.local_sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json

      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts

      - name: Install dependencies
        run: npm ci
        working-directory: projects/sdk

      - name: Build SDK package (codegen + tsc)
        run: npm run build
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}

      - name: Upload SDK package
        uses: actions/upload-artifact@v7
        with:
          name: sdk-dist
          path: projects/sdk/dist
          if-no-files-found: error
          retention-days: 7

  # Contracts lint/format/type-check - pure Node, no artifacts, no build. A
  # formatting-config change still lints them; tests stay contracts-only.
  lint-contracts:
    name: Contracts lint
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/contracts
      - name: Lint
        run: npm run lint
        working-directory: projects/contracts
      - name: Check formatting
        run: npm run format
        working-directory: projects/contracts
      - name: Type-check
        run: npm run check-types
        working-directory: projects/contracts

  # Contracts unit tests - pure Node; the offline suite runs the contract
  # source directly, so it never needs the compiled artifacts. The oracle is a
  # docs file, but it is the test input, so it triggers this lane.
  test-contracts:
    name: Contracts tests
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/contracts
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/contracts

  # SDK checks - run when the SDK, contracts, a shared path, or the formatting
  # config changed. Codegen regenerates the clients from the same-run artifacts
  # when the contracts changed (SDK_SPECS=local), from the pinned specs release
  # otherwise.
  lint-sdk:
    name: SDK lint
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.contracts == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Install dependencies
        run: npm ci
        working-directory: projects/sdk
      - name: Regenerate clients
        run: npm run codegen
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Lint
        run: npm run lint
        working-directory: projects/sdk
      - name: Check formatting
        run: npm run format
        working-directory: projects/sdk
      - name: Type-check
        run: npm run check-types
        working-directory: projects/sdk

  test-sdk:
    name: SDK tests
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.contracts == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Install dependencies
        run: npm ci
        working-directory: projects/sdk
      - name: Regenerate clients
        run: npm run codegen
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/sdk

  # Frontend checks - run when the frontend, SDK, contracts, a shared path, or
  # the formatting config changed. Frontend-only and shared-only changes install
  # the published @kasakame/sdk; SDK/contracts changes consume the same-run
  # `sdk-dist` built by `build-sdk`.
  lint-frontend:
    name: Frontend lint
    needs: [changes, build-contracts, build-sdk]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.config == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/frontend/package-lock.json
      - name: Download the local SDK
        if: needs.changes.outputs.local_sdk == 'true'
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: projects/sdk/dist
      - name: Install frontend dependencies (published SDK)
        if: needs.changes.outputs.local_sdk != 'true'
        run: npm ci
        working-directory: projects/frontend
      - name: Install frontend dependencies (local SDK)
        if: needs.changes.outputs.local_sdk == 'true'
        run: npm install --no-save --install-links "file:../sdk"
        working-directory: projects/frontend
      - name: Lint
        run: npm run lint
        working-directory: projects/frontend
      - name: Check formatting
        run: npm run format
        working-directory: projects/frontend
      - name: Type-check
        run: npm run check-types
        working-directory: projects/frontend

  test-frontend:
    name: Frontend tests
    needs: [changes, build-contracts, build-sdk]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.contracts == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/frontend/package-lock.json
      - name: Download the local SDK
        if: needs.changes.outputs.local_sdk == 'true'
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: projects/sdk/dist
      - name: Install frontend dependencies (published SDK)
        if: needs.changes.outputs.local_sdk != 'true'
        run: npm ci
        working-directory: projects/frontend
      - name: Install frontend dependencies (local SDK)
        if: needs.changes.outputs.local_sdk == 'true'
        run: npm install --no-save --install-links "file:../sdk"
        working-directory: projects/frontend
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/frontend

  # Production bundle gate: catches Vite/Rollup-only failures (resolution, env
  # inlining, tree-shaking) that `tsc --noEmit` and Vitest do not. Independent
  # of the lint/test lanes, so it runs in parallel; the only input is the SDK
  # choice, which it resolves the same way they do.
  build:
    name: Build frontend bundle
    needs: [changes, build-contracts, build-sdk]
    if: always() && !failure() && !cancelled() && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.contracts == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/frontend/package-lock.json
      - name: Download the local SDK
        if: needs.changes.outputs.local_sdk == 'true'
        uses: actions/download-artifact@v8
        with:
          name: sdk-dist
          path: projects/sdk/dist
      - name: Install frontend dependencies (published SDK)
        if: needs.changes.outputs.local_sdk != 'true'
        run: npm ci
        working-directory: projects/frontend
      - name: Install frontend dependencies (local SDK)
        if: needs.changes.outputs.local_sdk == 'true'
        run: npm install --no-save --install-links "file:../sdk"
        working-directory: projects/frontend
      - name: Build frontend bundle (Vite)
        run: npx vite build
        working-directory: projects/frontend

  # Deploy + exercise the compiled TEAL on a live LocalNet. Reuses the
  # same-run contract artifacts; contracts-only by design.
  integration-test:
    name: LocalNet integration tests
    needs: [changes, build-contracts]
    if: always() && needs.changes.outputs.contracts == 'true' && needs.build-contracts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json

      - name: Download contract artifacts
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AlgoKit CLI
        run: |
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install contract dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Start LocalNet (algod + indexer)
        run: algokit localnet start

      - name: Run LocalNet integration tests
        run: npm run test:integration
        working-directory: projects/contracts

  # Backend lane: lint/format/types plus the suite against a throwaway
  # Postgres. Independent of contracts/SDK/frontend; a formatting-config change
  # still checks it.
  backend:
    name: Backend lint and tests
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasakame
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kasakame
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/backend
      - name: Run migrations
        run: npm run db:migrate
        working-directory: projects/backend
      - name: Lint
        run: npm run lint
        working-directory: projects/backend
      - name: Check formatting
        run: npm run format
        working-directory: projects/backend
      - name: Type-check
        run: npm run check-types
        working-directory: projects/backend
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/backend

  # Single required check: skipped change-detection jobs don't block merges
  # under strict branch protection - only failures and cancellations do.
  gate:
    name: Gate
    if: always()
    needs:
      - changes
      - actionlint
      - shellcheck
      - build-contracts
      - build-sdk
      - lint-contracts
      - test-contracts
      - lint-sdk
      - test-sdk
      - lint-frontend
      - test-frontend
      - build
      - integration-test
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs failed or were cancelled:" >&2
          echo '${{ toJSON(needs) }}' >&2
          exit 1
      - name: Pass
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All jobs passed or were skipped."
