name: build-and-test

on:
  pull_request:
  push:
    branches: [main]

# Same-commit gate, split into fast per-project jobs. `changes` decides what the
# change touches: the contracts jobs (lint, tests, compile) run only when
# projects/contracts/** (or this workflow) changed, so unrelated PRs never
# compile the contracts. The SDK lanes run every time and regenerate their
# clients from the same-run `contracts-artifacts` when the contracts changed,
# from the pinned specs release otherwise. The frontend lanes and `build` run
# every time: the frontend lanes install the published @kasakame/sdk on a
# frontend-only change and build/use the local `file:../sdk` when the SDK or
# contracts changed; `build` always bundles against the local SDK as the
# same-SHA end-to-end gate. `gate` is the single required check.

jobs:
  # Path detection. Outputs:
  # - `contracts`: run the contracts jobs, compile them once, and use the local
  #   ARC-56 specs.
  # - `local_sdk`: the frontend lanes build and use the local SDK instead of
  #   the published package (the SDK changed, or the contracts did).
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.detect.outputs.contracts }}
      local_sdk: ${{ steps.detect.outputs.local_sdk }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: detect
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            base="$(git merge-base FETCH_HEAD HEAD)"
            files="$(git diff --name-only "$base" HEAD)"
          else
            # A push to main validates everything.
            files="$(git ls-files)"
          fi
          contracts=false
          local_sdk=false
          if printf '%s\n' "$files" | grep -Eq '^(projects/contracts/|\.github/)'; then
            contracts=true
          fi
          if [ "$contracts" = true ] || printf '%s\n' "$files" | grep -q '^projects/sdk/'; then
            local_sdk=true
          fi
          printf 'contracts=%s\nlocal_sdk=%s\n' "$contracts" "$local_sdk" >> "$GITHUB_OUTPUT"
          printf 'contracts=%s local_sdk=%s (%s paths)\n' "$contracts" "$local_sdk" "$(printf '%s\n' "$files" | wc -l)"

  # Compile the contracts once when they changed. The artifact feeds the SDK
  # lanes, the frontend lanes, `build`, and `integration-test` instead of each
  # recompiling.
  build-contracts:
    name: Build contracts (TEAL + ARC-56 artifacts)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AlgoKit CLI
        run: |
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Compile contracts (TEAL + generate clients)
        run: npm run build
        working-directory: projects/contracts

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v7
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
          if-no-files-found: error

  # Contracts lint/format/type-check - pure Node, no artifacts, no build.
  lint-contracts:
    name: Lint, format, type-check (contracts)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/contracts
      - name: Lint
        run: npm run lint
        working-directory: projects/contracts
      - name: Check formatting
        run: npm run format
        working-directory: projects/contracts
      - name: Type-check
        run: npm run check-types
        working-directory: projects/contracts

  # Contracts unit tests - pure Node; the offline suite runs the contract
  # source directly, so it never needs the compiled artifacts.
  test-contracts:
    name: Unit tests (contracts)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/contracts
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/contracts

  # SDK checks - run on every PR. Codegen regenerates the clients from the
  # same-run artifacts when the contracts changed (SDK_SPECS=local), from the
  # pinned specs release otherwise.
  lint-sdk:
    name: Lint, format, type-check (sdk)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Install dependencies
        run: npm ci
        working-directory: projects/sdk
      - name: Regenerate clients
        run: npm run codegen
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Lint
        run: npm run lint
        working-directory: projects/sdk
      - name: Check formatting
        run: npm run format
        working-directory: projects/sdk
      - name: Type-check
        run: npm run check-types
        working-directory: projects/sdk

  test-sdk:
    name: Unit tests (sdk)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Install dependencies
        run: npm ci
        working-directory: projects/sdk
      - name: Regenerate clients
        run: npm run codegen
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/sdk

  # Frontend checks - run on every PR. A frontend-only change installs the
  # published @kasakame/sdk, so routine work exercises what users install; an
  # SDK or contracts change builds the local `file:../sdk` (same-run artifacts
  # when the contracts changed) and resolves that instead.
  lint-frontend:
    name: Lint, format, type-check (frontend)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            projects/frontend/package-lock.json
            projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Build the local SDK
        if: needs.changes.outputs.local_sdk == 'true'
        run: |
          npm ci
          npm run build
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Install frontend dependencies (published SDK)
        if: needs.changes.outputs.local_sdk != 'true'
        run: npm ci
        working-directory: projects/frontend
      - name: Install frontend dependencies (local SDK)
        if: needs.changes.outputs.local_sdk == 'true'
        run: npm install --no-save --install-links "file:../sdk"
        working-directory: projects/frontend
      - name: Lint
        run: npm run lint
        working-directory: projects/frontend
      - name: Check formatting
        run: npm run format
        working-directory: projects/frontend
      - name: Type-check
        run: npm run check-types
        working-directory: projects/frontend

  test-frontend:
    name: Unit tests (frontend)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            projects/frontend/package-lock.json
            projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Build the local SDK
        if: needs.changes.outputs.local_sdk == 'true'
        run: |
          npm ci
          npm run build
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Install frontend dependencies (published SDK)
        if: needs.changes.outputs.local_sdk != 'true'
        run: npm ci
        working-directory: projects/frontend
      - name: Install frontend dependencies (local SDK)
        if: needs.changes.outputs.local_sdk == 'true'
        run: npm install --no-save --install-links "file:../sdk"
        working-directory: projects/frontend
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/frontend

  # The same-SHA end-to-end gate: always bundles the frontend against the local
  # SDK - built from the same-run artifacts when the contracts changed, from
  # the pinned specs release otherwise.
  build:
    name: Build (SDK + frontend bundle)
    needs: [changes, build-contracts]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            projects/frontend/package-lock.json
            projects/sdk/package-lock.json
      - name: Download contract artifacts
        if: needs.changes.outputs.contracts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts
      - name: Install SDK dependencies
        run: npm ci
        working-directory: projects/sdk
      - name: Build SDK package (codegen + tsc)
        run: npm run build
        working-directory: projects/sdk
        env:
          SDK_SPECS: ${{ needs.changes.outputs.contracts == 'true' && 'local' || 'release' }}
      - name: Install frontend dependencies (local SDK)
        run: npm install --no-save --install-links "file:../sdk"
        working-directory: projects/frontend
      - name: Build frontend bundle (Vite)
        run: npx vite build
        working-directory: projects/frontend

  # Deploy + exercise the compiled TEAL on a live LocalNet. Reuses the
  # same-run contract artifacts; only meaningful when the contracts changed.
  integration-test:
    name: Integration tests (localnet)
    needs: [changes, build-contracts]
    if: always() && needs.changes.outputs.contracts == 'true' && needs.build-contracts.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/contracts/package-lock.json

      - name: Download contract artifacts
        uses: actions/download-artifact@v8
        with:
          name: contracts-artifacts
          path: projects/contracts/smart_contracts/artifacts

      - name: Set up Python (for AlgoKit CLI)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install AlgoKit CLI
        run: |
          if ! command -v algokit >/dev/null 2>&1; then
            pipx install algokit==2.10.2
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        shell: bash

      - name: Install contract dependencies
        run: npm ci
        working-directory: projects/contracts

      - name: Start LocalNet (algod + indexer)
        run: algokit localnet start

      - name: Run LocalNet integration tests
        run: npm run test:integration
        working-directory: projects/contracts

  # Backend lane: lint/format/types plus the suite against a throwaway
  # Postgres. Needs nothing from the other jobs, so it runs standalone.
  backend:
    name: Backend (lint, format, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kasakame
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kasakame
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: projects/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: projects/backend
      - name: Run migrations
        run: npm run db:migrate
        working-directory: projects/backend
      - name: Lint
        run: npm run lint
        working-directory: projects/backend
      - name: Check formatting
        run: npm run format
        working-directory: projects/backend
      - name: Type-check
        run: npm run check-types
        working-directory: projects/backend
      - name: Run unit tests with coverage
        run: npm run test:coverage
        working-directory: projects/backend

  # Single required check: skipped change-detection jobs don't block merges
  # under strict branch protection - only failures and cancellations do.
  gate:
    name: Gate
    if: always()
    needs:
      - changes
      - build-contracts
      - lint-contracts
      - test-contracts
      - lint-sdk
      - test-sdk
      - lint-frontend
      - test-frontend
      - build
      - integration-test
      - backend
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs failed or were cancelled:" >&2
          echo '${{ toJSON(needs) }}' >&2
          exit 1
      - name: Pass
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All jobs passed or were skipped."
