name: Feature
description: A user-visible capability.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The user problem this feature solves, and why it matters.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: What the user should see or be able to do.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One observable outcome per line.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this feature deliberately does not cover.
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Docs, designs, or references.
    validations:
      required: false
