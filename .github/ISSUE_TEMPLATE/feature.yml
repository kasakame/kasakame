name: Feature
description: A user-visible capability.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: What should the user see or be able to do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes, one per line. Keep the checkboxes.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this feature deliberately does not cover.
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Docs, designs, or references.
    validations:
      required: false
