name: Epic
description: A workstream inside one component. Set the parent component and project fields after creating.
type: Epic
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: The outcome this workstream delivers, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why this matters now, and what is blocked or lost if it is not done.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The work included. Link the planned child tickets as they are created.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Observable outcomes that allow closing the epic. An epic may stay open indefinitely; close it only when the work is finished for good or a follow-up epic exists.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: not-in-this-epic
    attributes:
      label: Not in this epic
      description: Work deliberately outside this workstream; link the epic that owns it.
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Component issue, related epics and tickets, docs.
    validations:
      required: false
