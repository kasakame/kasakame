name: Epic
description: A workstream inside one component.
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        After creating, set the parent to a component from the **Sub-issue** menu, then set **Component**, **Priority**, and **Effort** in the sidebar. The `check-issue` job fills a missing Component and flags missing Priority or Effort with `needs-triage`.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What this workstream delivers, why it matters, and what is in scope.
      placeholder: |
        Outcome:
        Why it matters:
        In scope:
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Observable outcomes that allow closing the epic. An epic may stay open indefinitely; close it only when the work is finished for good or a follow-up epic exists.
      value: |
        - [ ]
    validations:
      required: true
