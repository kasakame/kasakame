name: Epic
description: A workstream inside one component. Set the parent component and project fields after creating.
type: Epic
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What this workstream delivers, why it matters, and what is in scope. Link the planned child tickets.
      placeholder: |
        Outcome:
        Why it matters:
        In scope:
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Observable outcomes that allow closing the epic. An epic may stay open indefinitely; close it only when the work is finished for good or a follow-up epic exists.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: not-in-this-epic
    attributes:
      label: Not in this epic
      description: Work deliberately outside this workstream; link the epic that owns it.
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Component issue, related epics and tickets, docs.
    validations:
      required: false
