version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /projects/contracts
    schedule:
      interval: weekly
    groups:
      contracts:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /projects/sdk
    schedule:
      interval: weekly
    groups:
      sdk:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /projects/frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /projects/cli
    schedule:
      interval: weekly
    groups:
      cli:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /projects/backend
    schedule:
      interval: weekly
    groups:
      backend:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
